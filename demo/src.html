<!doctype html>
<html><head><meta charset="utf-8"><title>Motion Agent promo</title>
<style>
@font-face{font-family:G;src:url(data:font/woff2;base64,__GEIST__) format('woff2');font-weight:100 900}
@font-face{font-family:GM;src:url(data:font/woff2;base64,__MONO__) format('woff2');font-weight:500}
html,body{margin:0;background:#000;overflow:hidden}
#c{position:absolute;left:0;top:0;transform-origin:0 0}
#ui{position:fixed;bottom:10px;left:10px;font:14px GM;color:#fff;display:flex;gap:8px;align-items:center}
#ui input{width:60vw}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui"><button id="pb">play</button><input id="sc" type="range" min="0" max="15" step="0.01" value="0"></div>
<script>
/* BEAT SHEET — 128 BPM, beat B=0.46875s, bar=1.875s, 15s total
 0.00  spark dot pulses (blip)            0.94 dot stretches into line + label (whoosh)
 1.64  line floods screen orange (impact) 1.875 SCENE 2 brand slam MOTION AGENT letters on 1/16 (riser before)
 3.28  full stop detaches, grows -> cream flood (whoosh)
 3.75  PLAN (cream)  4.69 ANIMATE (black, outline pattern)  5.63 RENDER (blue, viewfinder)  6.56 "& verify." (blips each)
 7.03  black bar wipe (whoosh)            7.50 SCENE 4 cube field ripple, "9 SKILLS" (impact)
 10.31 SCENE 5 terminal card: typing (blips), progress, Done ✓ toast (ding 11.95)
 12.19 card collapses to dot -> ring pulse (whoosh)
 13.13 end card: MOTION AGENT. + tagline + URL typing (riser, ring-out)
*/
const W=1920,H=1080,D=15,B=60/128;
window.VIDEO={w:W,h:H,duration:D};
const C=document.getElementById('c'),x=C.getContext('2d');
const INK='#0B0B10',ACC='#FF4F1A',CREAM='#EDEBE4',BLUE='#2F47FF',WH='#FFFFFF';
function spring(t,w=14,z=.82){if(t<=0)return 0;if(z>=1)return 1-Math.exp(-w*t)*(1+w*t);const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=v=>(v=clamp(v),v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2);
const eo=v=>1-Math.pow(1-clamp(v),3);
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rng=s=>()=>(s=(s+0x6D2B79F5)|0,s=Math.imul(s^(s>>>15),1|s),s^=s+Math.imul(s^(s>>>7),61|s),((s^(s>>>14))>>>0)/4294967296);

// pre-baked vignette + grain
const vig=document.createElement('canvas');vig.width=W;vig.height=H;{const g=vig.getContext('2d'),r=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*1.05);r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,.42)');g.fillStyle=r;g.fillRect(0,0,W,H);}
const grains=[];{const R=rng(7);for(let k=0;k<4;k++){const c=document.createElement('canvas');c.width=256;c.height=256;const g=c.getContext('2d'),d=g.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=R()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=14;}g.putImageData(d,0,0);grains.push(c);}}

function font(w,s,f='G'){x.font=`${w} ${s}px ${f}`;}
function txt(s,X,Y,al='center'){x.textAlign=al;x.textBaseline='middle';x.fillText(s,X,Y);}
function grid(a){x.strokeStyle=`rgba(255,255,255,${a})`;x.lineWidth=1;for(let i=0;i<=W;i+=80){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke();}for(let j=0;j<=H;j+=80){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke();}}
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r);}

const SC=[[0,'OPEN'],[1.875,'BRAND'],[3.75,'KINETIC TYPE'],[7.5,'SKILLS'],[10.3125,'PRODUCT'],[13.125,'END CARD']];
function hud(t,dark){const c=dark?'rgba(255,255,255,.5)':'rgba(11,11,16,.5)';x.strokeStyle=c;x.fillStyle=c;x.lineWidth=2;const m=40,l=36;
 [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([a,b,sx,sy])=>{x.beginPath();x.moveTo(a,b+sy*l);x.lineTo(a,b);x.lineTo(a+sx*l,b);x.stroke();});
 let i=0;SC.forEach((s,k)=>{if(t>=s[0])i=k;});font(500,14,'GM');
 txt(`SCENE ${String(i+1).padStart(2,'0')} / 06`,W-64,64,'right');txt(SC[i][1],64,H-64,'left');
 const f=Math.floor(t*30);txt(`00:${String(Math.floor(t)).padStart(2,'0')}:${String(f%30).padStart(2,'0')}`,W-64,H-64,'right');
 x.fillStyle='#ff2a2a';x.beginPath();x.arc(W-190,H-64,5,0,7);x.fill();}

// scene 1: spark -> line -> flood
function s1(t){x.fillStyle=INK;x.fillRect(0,0,W,H);grid(.05);
 const cy=H/2,len=eo(seg(t,.94,1.4))*W*.42,wob=Math.sin(t*40)*Math.exp(-(t-1.4)*8)*(t>1.4?14:0);
 x.fillStyle=ACC;
 if(t<.94){const p=1+.35*Math.sin(t*Math.PI*2/B)*.5+spring(t,18,.5)*0;const r=7*spring(t,20,.5)*p;x.beginPath();x.arc(W/2,cy,r,0,7);x.fill();}
 else{const fh=4+ease(seg(t,1.64,1.875))*H;x.fillRect(W/2-len,cy-fh/2+wob*(1-seg(t,1.64,1.7)),len*2,fh);
  if(t<1.64){font(500,16,'GM');x.fillStyle=`rgba(255,255,255,${seg(t,1.1,1.3)*.8})`;txt('motion-agent / launch — 2026',W/2-len,cy-28,'left');}}}

// scene 2: brand slam on orange
const NAME='MOTION AGENT';
function s2(t){const u=t-1.875;x.fillStyle=ACC;x.fillRect(0,0,W,H);x.drawImage(vig,0,0);
 font(500,18,'GM');x.fillStyle=`rgba(11,11,16,${seg(u,0,.2)*.75})`;txt('INTRODUCING — 2026',W/2,H/2-150);
 const wgt=Math.round(lerp(200,900,ease(seg(u,.1,.9))));font(wgt,190);x.textAlign='left';x.textBaseline='middle';
 const total=x.measureText(NAME+'.').width;let X=W/2-total/2;
 for(let i=0;i<NAME.length;i++){const ch=NAME[i],w=x.measureText(ch).width,s=spring(u-i*B/8,22,.62);
  x.save();x.beginPath();x.rect(X-4,H/2-110,w+8,220);x.clip();x.fillStyle=INK;x.fillText(ch,X,H/2+(1-s)*200);x.restore();X+=w;}
 // full stop detaches & grows into cream
 const ds=spring(u-NAME.length*B/8,22,.6),dw=x.measureText('.').width,dx=X+dw*.45,dy=H/2+58;
 const g=ease(seg(t,3.28,3.75));const r=lerp(16,2400,g*g);x.fillStyle=g>0?CREAM:INK;
 x.beginPath();x.arc(lerp(dx,W/2,g),lerp(dy,H/2,g),r*ds,0,7);x.fill();
 font(500,40,'G');x.font='italic 400 44px G';x.fillStyle=`rgba(11,11,16,${seg(u,.9,1.1)*(1-g)})`;txt('agent skills for motion graphics',W/2,H/2+170);}

// scene 3: kinetic triplet
function s3(t){const words=[['PLAN',CREAM,INK],['ANIMATE',INK,ACC],['RENDER',BLUE,WH],['& verify.',CREAM,INK]];
 const i=Math.min(3,Math.floor((t-3.75)/(2*B))),st=3.75+i*2*B,u=t-st,[w,bg,fg]=words[i];
 x.fillStyle=bg;x.fillRect(0,0,W,H);
 if(i==1){font(900,150);x.strokeStyle='rgba(255,79,26,.18)';x.lineWidth=2;for(let r=0;r<8;r++){const off=((r%2?1:-1)*u*120)%600;for(let k=-1;k<5;k++){x.textAlign='left';x.strokeText('ANIMATE',k*700+off+(r%2)*300,r*150+40);}}}
 if(i==2){x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=3;const bw=900,bh=380,l=50,cx=W/2,cy=H/2;[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{const X=cx+a*bw/2,Y=cy+b*bh/2;x.beginPath();x.moveTo(X,Y-b*l);x.lineTo(X,Y);x.lineTo(X-a*l,Y);x.stroke();});font(500,16,'GM');x.fillStyle='rgba(255,255,255,.7)';txt('1920 × 1080',cx+bw/2,cy+bh/2+30,'right');}
 const s=spring(u,22,.62),slide=(1-s)*260,bl=(1-seg(u,0,.12));
 x.fillStyle=fg;x.save();x.translate(W/2-slide,H/2);x.scale(1+bl*.3,1);
 if(i==3){x.font='italic 300 210px G';const full=x.measureText(w).width;x.beginPath();x.rect(-full/2-10,-150,(full+20)*eo(seg(u,0,.6)),300);x.clip();txt(w,0,0);}
 else{font(900,230);txt(w,0,0);}x.restore();
 // black bar wipe at end into scene 4
 const wp=ease(seg(t,7.03,7.5));if(wp>0){x.fillStyle=INK;x.fillRect(0,0,W*wp,H);}}

// scene 4: cube field ripple
function iso(px,py,pz,cam){const ca=Math.cos(cam),sa=Math.sin(cam);let X=px*ca-py*sa,Y=px*sa+py*ca;const sx=(X-Y)*.9,sy=(X+Y)*.45-pz;return [W/2+sx,H/2+60+sy];}
function s4(t){const u=t-7.5;x.fillStyle=INK;x.fillRect(0,0,W,H);grid(.04);
 const N=9,S=56,cam=.15*Math.sin(u*.6),list=[];
 for(let a=0;a<N;a++)for(let b=0;b<N;b++){const px=(a-(N-1)/2)*S,py=(b-(N-1)/2)*S,d=Math.hypot(a-4,b-4);
  const appear=spring(u-d*.06,16,.6),h=(30+60*Math.max(0,Math.sin(u*5-d*1.1)))*appear;list.push([px,py,h,d,a+b]);}
 list.sort((p,q)=>p[4]-q[4]);
 for(const [px,py,h,d] of list){const s=S*.42,top=[[-s,-s],[s,-s],[s,s],[-s,s]].map(([dx,dy])=>iso(px+dx,py+dy,h,cam)),bot=[[-s,-s],[s,-s],[s,s],[-s,s]].map(([dx,dy])=>iso(px+dx,py+dy,0,cam));
  const k=clamp(h/90);const face=(pts,col)=>{x.fillStyle=col;x.beginPath();pts.forEach((p,j)=>j?x.lineTo(...p):x.moveTo(...p));x.closePath();x.fill();};
  face([top[1],top[2],bot[2],bot[1]],`rgb(${lerp(20,180,k)|0},${lerp(28,50,k)|0},${lerp(120,20,k)|0})`);
  face([top[2],top[3],bot[3],bot[2]],`rgb(${lerp(14,140,k)|0},${lerp(20,38,k)|0},${lerp(90,14,k)|0})`);
  face(top,k>.8?ACC:`rgb(${lerp(47,255,k)|0},${lerp(71,79,k)|0},${lerp(255,26,k)|0})`);}
 const a=spring(u-.3,18,.7);font(900,120);x.fillStyle=`rgba(255,255,255,${a})`;txt('9 SKILLS',W/2,170+(1-a)*60);
 font(500,22,'GM');x.fillStyle=`rgba(255,255,255,${seg(u,.6,.9)*.7})`;txt('director · explainers · b-roll · cutout · sound · verify',W/2,250);
 const wp=ease(seg(t,10.0,10.3125));if(wp>0){x.fillStyle=CREAM;x.beginPath();x.arc(W/2,H/2,wp*1200,0,7);x.fill();}}

// scene 5: product micro-moment
function card(cx,cy,w,h,rot,fill){x.save();x.translate(cx,cy);x.rotate(rot);x.fillStyle='rgba(0,0,0,.12)';rr(-w/2+14,-h/2+20,w,h,22);x.fill();x.fillStyle=fill;rr(-w/2,-h/2,w,h,22);x.fill();x.restore();}
function s5(t){const u=t-10.3125;const col=ease(seg(t,12.19,12.6));
 x.fillStyle=CREAM;x.fillRect(0,0,W,H);x.drawImage(vig,0,0);
 const k=Math.max(.001,1-col),e=spring(u,14,.75),cw=1000,ch=480,cx=W/2,cy=H/2+(1-e)*80,rot=-.04*k;
 x.save();x.translate(W/2,H/2);x.scale(k*e,k*e);x.translate(-W/2,-H/2);
 card(cx+40,cy-36,cw,ch,rot+.05,'#d6d3ca');card(cx+20,cy-18,cw,ch,rot+.025,'#e2dfd7');
 card(cx,cy,cw,ch,rot,INK);
 {x.save();x.translate(cx,cy);x.rotate(rot);x.globalAlpha=k;
  ['#ff5f57','#febc2e','#28c840'].forEach((c,j)=>{x.fillStyle=c;x.beginPath();x.arc(-cw/2+40+j*28,-ch/2+36,8,0,7);x.fill();});
  const cmd='/motion-graphics make a 15 s launch promo',n=Math.floor(clamp((u-.2)/.9)*cmd.length);
  font(500,30,'GM');x.fillStyle=WH;x.textAlign='left';x.textBaseline='middle';x.fillText('> '+cmd.slice(0,n)+((Math.floor(u*4)%2||n<cmd.length)?'▍':''),-cw/2+50,-80);
  const p=ease(seg(u,1.2,1.85));x.fillStyle='rgba(255,255,255,.12)';rr(-cw/2+50,10,cw-100,18,9);x.fill();x.fillStyle=ACC;rr(-cw/2+50,10,(cw-100)*p+1,18,9);x.fill();
  font(500,22,'GM');x.fillStyle='rgba(255,255,255,.7)';x.fillText(p<1?`rendering… ${Math.round(p*100)}%`:'probe-mp4: 1920x1080 · h264 · 60 fps',-cw/2+50,70);
  const dn=spring(u-1.64,20,.6);x.fillStyle=p<1?'rgba(255,255,255,.15)':ACC;rr(cw/2-260,120,210,64,32);x.fill();font(700,26);x.fillStyle=WH;x.textAlign='center';x.fillText(p<1?'Render':'Done ✓',cw/2-155,153);
  x.restore();x.restore();
  const ts=spring(u-1.68,18,.7);x.save();x.translate(W-380+(1-ts)*500,140);x.fillStyle=WH;rr(0,0,320,80,16);x.fill();x.fillStyle=ACC;x.beginPath();x.arc(40,40,10,0,7);x.fill();font(600,22);x.fillStyle=INK;x.textAlign='left';x.fillText('demo.mp4 ready',66,42);x.restore();}
 // ring pulse bridge
 if(col>.9){const r=seg(t,12.6,13.1);x.strokeStyle=ACC;x.lineWidth=6*(1-r)+1;x.beginPath();x.arc(W/2,H/2,20+r*500,0,7);x.stroke();x.fillStyle=ACC;x.beginPath();x.arc(W/2,H/2,12,0,7);x.fill();}
 const wp=ease(seg(t,12.8,13.125));if(wp>0){x.fillStyle=INK;x.beginPath();x.arc(W/2,H/2,wp*1200,0,7);x.fill();}}

// scene 6: end card
function s6(t){const u=t-13.125;x.fillStyle=INK;x.fillRect(0,0,W,H);grid(.04);x.drawImage(vig,0,0);
 const a=spring(u,16,.7);font(900,150);x.textAlign='left';x.textBaseline='middle';const tw=x.measureText(NAME).width;
 x.fillStyle=`rgba(255,255,255,${a})`;x.fillText(NAME,W/2-tw/2-20,H/2-60+(1-a)*40);
 x.fillStyle=ACC;x.beginPath();x.arc(W/2+tw/2+10,H/2-60+42,16*spring(u-.15,20,.5),0,7);x.fill();
 x.font='italic 300 46px G';x.fillStyle=`rgba(237,235,228,${seg(u,.3,.6)})`;txt('code-drawn video, directed by your agent',W/2,H/2+60);
 x.fillStyle=`rgba(255,255,255,${seg(u,.4,.7)*.3})`;x.fillRect(W/2-300,H/2+120,600*eo(seg(u,.4,.9)),1);
 const url='GITHUB.COM/COKER79/MOTION-GRAPHICS-AGENT',n=Math.floor(clamp((u-.6)/.8)*url.length);font(500,22,'GM');x.fillStyle='rgba(255,255,255,.75)';
 x.letterSpacing='4px';txt(url.slice(0,n),W/2,H/2+165);x.letterSpacing='0px';}

window.seek=function(t){t=((t%D)+D)%D;x.setTransform(1,0,0,1,0,0);
 if(t<1.875)s1(t);else if(t<3.75)s2(t);else if(t<7.5)s3(t);else if(t<10.3125)s4(t);else if(t<13.125)s5(t);else s6(t);
 x.drawImage(vig,0,0);const gt=grains[Math.floor(t*24)%4];for(let i=0;i<W;i+=256)for(let j=0;j<H;j+=256)x.drawImage(gt,i,j);
 const dark=!(t>=1.875&&t<3.75)&&!(t>=3.75&&t<7.03&&[0,3].includes(Math.min(3,Math.floor((t-3.75)/(2*B)))))&&!(t>=10.3125&&t<12.8);
 hud(t,dark);};

// ---------- sound ----------
window.buildAudio=async function(ctx){const sr=ctx.sampleRate,R=rng(99),nb=ctx.createBuffer(1,sr*2,sr),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=R()*2-1;
 const out=ctx.createGain();out.gain.value=.8;out.connect(ctx.destination);
 const music=ctx.createGain();music.gain.value=.55;music.connect(out);
 const env=(g,t,a,peak,d)=>{g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);};
 const osc=(type,f,t,dur,peak,dest=out,f2)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);env(g,t,.003,peak,dur);o.connect(g).connect(dest);o.start(t);o.stop(t+dur+.1);};
 const noise=(t,dur,peak,ftype,f1,f2,dest=out,q=1)=>{const s=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nb;fl.type=ftype;fl.Q.value=q;fl.frequency.setValueAtTime(f1,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);env(g,t,dur*.4>0.01&&f2?dur*.6:.002,peak,f2?dur*.4:dur);s.connect(fl).connect(g).connect(dest);s.start(t);s.stop(t+dur+.1);};
 const kick=t=>osc('sine',150,t,.28,.9,music,42);const clap=t=>noise(t,.12,.35,'bandpass',1500,null,music,.8);
 const roots=[55,55,65.4,49,43.6,55,65.4,55];
 for(let i=0;i<32;i++){const t=i*B;if(t<0.94)continue;kick(t);if(i%2)clap(t);noise(t+B/2,.04,.08,'highpass',8000,null,music);}
 for(let bar=0;bar<8;bar++){const t=bar*1.875;if(t<0.9)continue;for(let k=0;k<4;k++)osc('sawtooth',roots[bar],t+k*B,B*.9,.12,music);}
 const whoosh=t=>noise(t-.25,.4,.35,'bandpass',300,4000,out,2);const impact=t=>{osc('sine',90,t,.7,.9,out,30);noise(t,.3,.4,'lowpass',3000,null);};
 const riser=(t,d)=>noise(t-d,d,.3,'bandpass',200,6000,out,3);const blip=(t,f=880)=>osc('square',f,t,.07,.12);
 blip(0.02,1320);blip(.47,1320);whoosh(.94);riser(1.875,1.2);impact(1.64);
 for(let i=0;i<NAME.length;i++)if(NAME[i]!=' ')blip(1.875+i*B/8,660+i*40);
 whoosh(3.6);[3.75,4.69,5.625,6.56].forEach((t,i)=>{blip(t,700+i*120);impact(t);});whoosh(7.3);impact(7.5);
 for(let i=0;i<14;i++)blip(10.51+i*.065,1500+(i%3)*200);osc('sine',1568,11.96,.6,.25);osc('sine',2093,12.02,.6,.18);
 whoosh(12.45);riser(13.125,1.1);impact(13.125);osc('sine',880,13.3,1.6,.18);osc('sine',1318,13.3,1.6,.1);};

// ---------- preview ----------
if(location.search.includes('render')){document.getElementById('ui').remove();}
else{const fit=()=>{const s=Math.min(innerWidth/W,innerHeight/H);C.style.transform=`scale(${s})`;};addEventListener('resize',fit);fit();
 let buf,ac,src,startAt=0,offset=0,playing=false;const sc=document.getElementById('sc'),pb=document.getElementById('pb');
 async function play(){ac??=new AudioContext();if(!buf){const off=new OfflineAudioContext(2,Math.ceil(48000*D),48000);await buildAudio(off);buf=await off.startRendering();}src=ac.createBufferSource();src.buffer=buf;src.connect(ac.destination);src.start(0,offset%D);startAt=ac.currentTime;playing=true;pb.textContent='pause';}
 function pause(){if(!playing)return;offset+=ac.currentTime-startAt;src.stop();playing=false;pb.textContent='play';}
 const now=()=>playing?(offset+ac.currentTime-startAt)%D:offset;
 pb.onclick=()=>playing?pause():play();sc.oninput=()=>{const p=playing;pause();offset=+sc.value;if(p)play();};
 (function loop(){const t=now();seek(t);if(playing)sc.value=t;requestAnimationFrame(loop);})();}
</script></body></html>

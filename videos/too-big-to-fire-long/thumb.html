<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G;src:url(data:font/woff2;base64,__GEIST__) format('woff2');font-weight:100 900}
@font-face{font-family:GM;src:url(data:font/woff2;base64,__MONO__) format('woff2');font-weight:500}
html,body{margin:0;background:#000}</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
const x=document.getElementById('c').getContext('2d'),W=1280,H=720;const im=new Image();im.src='data:image/png;base64,__PHIL__';
im.decode().then(async()=>{await document.fonts.load('900 10px G');await document.fonts.load('500 10px GM');
 // background: stormy night city
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07050f');g.addColorStop(.6,'#2a1036');g.addColorStop(1,'#6a1a1a');x.fillStyle=g;x.fillRect(0,0,W,H);
 let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;let X=0;while(X<W){const bw=40+R()*90,bh=120+R()*260;x.fillStyle=R()<.5?'#120b1e':'#0d0816';x.fillRect(X,H-bh,bw,bh);for(let wy=H-bh+12;wy<H;wy+=18)for(let wx=X+8;wx<X+bw-8;wx+=14)if(R()<.15){x.fillStyle='rgba(255,200,130,.35)';x.fillRect(wx,wy,6,8);}X+=bw+4;}
 // red Nvidia tower on the right
 const tx=1160,tw=190,top=40;const rg=x.createRadialGradient(tx,top+40,10,tx,top+40,420);rg.addColorStop(0,'rgba(255,50,40,.75)');rg.addColorStop(1,'rgba(255,50,40,0)');x.fillStyle=rg;x.fillRect(0,0,W,H);
 x.fillStyle='#1a0a0a';x.beginPath();x.moveTo(tx-tw/2,H);x.lineTo(tx-tw/2,top+60);x.lineTo(tx,top);x.lineTo(tx+tw/2,top+60);x.lineTo(tx+tw/2,H);x.fill();
 for(let y=top+90;y<H-10;y+=24)for(let c=0;c<6;c++)if(R()<.75){x.fillStyle=`rgba(255,${50+R()*40|0},40,${.5+R()*.5})`;x.fillRect(tx-tw/2+14+c*30,y,18,12);}
 x.save();x.font='900 40px G';x.textAlign='center';x.shadowColor='#ff3c32';x.shadowBlur=25;x.fillStyle='#ff5a4a';x.fillText('NVIDIA',tx,top+100);x.restore();
 // lightning bolt
 x.save();x.strokeStyle='rgba(230,235,255,.9)';x.lineWidth=4;x.shadowColor='#bfd0ff';x.shadowBlur=30;x.beginPath();[[900,0],[870,90],[905,110],[860,220],[895,240],[850,330]].forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();x.restore();
 // Phil on the left, faded into the scene
 const ph=H,pw=im.width*ph/im.height;x.save();x.drawImage(im,-120,0,pw,ph);const fade=x.createLinearGradient(pw-420,0,pw-120,0);fade.addColorStop(0,'rgba(7,5,15,0)');fade.addColorStop(1,'rgba(7,5,15,1)');x.fillStyle=fade;x.fillRect(pw-420,0,300,H);x.restore();
 x.fillStyle='rgba(120,20,40,.18)';x.fillRect(0,0,W,H);
 // headline
 const tl=(t,X,Y,size,fill)=>{x.font=`900 ${size}px G`;x.textAlign='left';x.textBaseline='alphabetic';x.lineJoin='round';x.strokeStyle='#000';x.lineWidth=18;x.strokeText(t,X,Y);x.fillStyle=fill;x.fillText(t,X,Y);};
 x.save();x.translate(560,0);x.rotate(-.03);tl('TOO BIG',0,320,128,'#ffffff');tl('TO FIRE?',0,455,128,'#FFD400');x.restore();
 // "TO FAIL" struck out tag
 x.save();x.translate(570,540);x.rotate(-.03);x.font='900 52px G';x.lineWidth=10;x.strokeStyle='#000';x.strokeText('TOO BIG TO FAIL',0,0);x.fillStyle='#cfc6b6';x.fillText('TOO BIG TO FAIL',0,0);const w=x.measureText('TOO BIG TO FAIL').width;x.strokeStyle='#ff3b3b';x.lineWidth=9;x.beginPath();x.moveTo(-6,-16);x.lineTo(w+6,-20);x.stroke();x.restore();
 // year chips
 [['1907','#c8a35a'],['2008','#4ea3ff'],['2026','#ff3c32']].forEach(([y,c],i)=>{const X=570+i*150,Y=590;x.fillStyle='rgba(0,0,0,.65)';x.beginPath();x.roundRect(X,Y,130,56,28);x.fill();x.strokeStyle=c;x.lineWidth=4;x.stroke();x.font='500 30px GM';x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(y,X+65,Y+30);});
 window.done=true;});
</script></body></html>

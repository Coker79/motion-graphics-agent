const W=1080,H=1920,OFF=7.0,T1=6.15,T2=7.05,VO=OFF+0.15,D=VO+28.6;window.VIDEO=null;const VID={w:W,h:H,duration:D};
const x=document.getElementById('c').getContext('2d');

// ---------- stick figure ----------

 if(o.reachR){const tx=(o.reachR[0]-o.x)/s,ty=(o.reachR[1]-o.y)/s,dx=tx-sh[0],dy=ty-sh[1],dd=Math.min(Math.hypot(dx,dy),118),base=Math.atan2(dx,dy),cosA=(62*62+dd*dd-58*58)/(2*62*dd),a=Math.acos(clamp(cosA,-1,1));const a1=base-a;const ex=sh[0]+Math.sin(a1)*62,ey=sh[1]+Math.cos(a1)*62;const ux=sh[0]+dx/Math.hypot(dx,dy)*dd,uy=sh[1]+dy/Math.hypot(dx,dy)*dd;ln(sh[0],sh[1],ex,ey,4.5,INK,5);ln(ex,ey,ux,uy,4.5,INK,15);hr=[ux,uy];}

 x.font='600 30px Sans';x.fillStyle='#7a6a50';x.textAlign='center';x.fillText('CASE FILE #4',W/2,190);hand('One man, trillions of dollars',W/2,290,70,RED);}

// ---------- scenes ----------
function tower(X,Y,n,tilt){x.save();x.translate(X,Y);x.rotate(tilt);for(let i=0;i<n;i++){x.fillStyle=i%2?'#cfe3c4':'#e6f0ff';x.strokeStyle=INK;x.lineWidth=4;x.fillRect(-110,-(i+1)*70,220,66);x.strokeRect(-110,-(i+1)*70,220,66);hand(i==n-1?'NVIDIA':'AI',0,-(i+1)*70+46,34,INK);}x.restore();return [X+Math.sin(tilt)*n*70,Y-Math.cos(tilt)*n*70];}

 else if(u<9.44){const v=u-5.48;hand('Then he\'s back.',W/2,370,84);const on=ease(seg(v,.3,1.4));const top=tower(300,1300,6,0);figure({x:lerp(top[0]+230,top[0],on),y:lerp(1300,top[1]-150,on)-Math.sin(on*Math.PI)*120,s:1.0,tag:'CEO',face:'smug',hat:'top',armL:[-2.4,.3],armR:[2.4,-.3]});
  x.fillStyle='rgba(255,255,255,.6)';x.fillRect(560,520,440,360);spark([[580,840],[700,820],[800,760],[880,600],[980,550]],ease(seg(v,1,2.6)),GRN);if(v>2.4)hand('+31%',800,940,96,GRN);}

 else if(u<17.79){const v=u-13.55;hand('The next day...',W/2,370,84);x.fillStyle='rgba(255,255,255,.6)';x.fillRect(140,560,800,460);spark([[160,980],[400,700],[600,620],[760,700],[920,860]],ease(seg(v,.3,2.2)),INK);if(v>1.6)hand('−6%',800,1100,96,RED);figure({x:W/2,y:1440,s:.9,face:'worry'});}

  [220,370,540,710,860].forEach((X,i)=>{x.globalAlpha=v<3.85?.25:1;figure({x:X,y:1300,s:.9,face:'strain',armL:[-2.8,.2],armR:[2.8,-.2]});x.globalAlpha=1;});}

 if(t>=T1&&t<T2){const k=ease(seg(t,T1,T2)),ex=lerp(W+260,-520,k),slope=.42;

  x.save();x.beginPath();x.moveTo(-10,-10);x.lineTo(edge(-10),-10);x.lineTo(edge(H+10),H+10);x.lineTo(-10,H+10);x.closePath();x.clip();x.drawImage(PAPER_TEX,0,0);intro(t);x.restore();
  const cw=150*Math.sin(Math.PI*k)+20;x.save();x.beginPath();x.moveTo(edge(-10),-10);x.lineTo(edge(-10)+cw,-10);x.lineTo(edge(H+10)+cw,H+10);x.lineTo(edge(H+10),H+10);x.closePath();
  const g=x.createLinearGradient(edge(H/2),H/2,edge(H/2)+cw,H/2);g.addColorStop(0,'#cfc3a4');g.addColorStop(.55,'#f6f0e0');g.addColorStop(1,'#e6dcc2');x.fillStyle=g;x.fill();x.restore();
  x.save();const sg=x.createLinearGradient(edge(H/2)+cw,H/2,edge(H/2)+cw+90,H/2);sg.addColorStop(0,'rgba(40,20,0,.28)');sg.addColorStop(1,'rgba(40,20,0,0)');x.fillStyle=sg;x.beginPath();x.moveTo(edge(-10)+cw,-10);x.lineTo(edge(-10)+cw+90,-10);x.lineTo(edge(H+10)+cw+90,H+10);x.lineTo(edge(H+10)+cw,H+10);x.closePath();x.fill();x.restore();}
 captions(t);x.font='600 34px Hand';x.fillStyle='rgba(60,40,20,.5)';x.textAlign='center';x.fillText('The Efficiency Edge',W/2,1780);
 if(t<.2){x.fillStyle=`rgba(236,227,204,${1-t/.2})`;x.fillRect(0,0,W,H);}if(t>D-.5){x.fillStyle=`rgba(236,227,204,${seg(t,D-.5,D)})`;x.fillRect(0,0,W,H);}};

// ---------- sound: voice on top, light tense pulse, action SFX ----------
const VOB='__VO__',INTRO_B='__INTRO__';
window.buildAudio=async function(ctx,stem='all'){const sr=ctx.sampleRate,out=ctx.createGain();out.connect(ctx.destination);
 if(stem!=='bg'){const b=await ctx.decodeAudioData(Uint8Array.from(atob(VOB),c=>c.charCodeAt(0)).buffer);const s=ctx.createBufferSource();s.buffer=b;s.connect(out);s.start(VO);}{const b2=await ctx.decodeAudioData(Uint8Array.from(atob(INTRO_B),c=>c.charCodeAt(0)).buffer);const s2=ctx.createBufferSource();s2.buffer=b2;s2.connect(out);s2.start(0);}if(stem==='voice')return;
 const bus=ctx.createGain();bus.gain.value=.42;bus.connect(out);const R=rng(5),nb=ctx.createBuffer(1,sr*2,sr),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=R()*2-1;
 bus.gain.setValueAtTime(.08,0);bus.gain.setValueAtTime(.08,4.9);bus.gain.linearRampToValueAtTime(.42,T2);
 const beat=60/96;for(let t=4.9;t<D-.8;t+=beat/2){const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();o.type='sawtooth';o.frequency.value=t>VO+17.8?46.2:41.2;lp.type='lowpass';lp.frequency.value=220;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+beat*.42);o.connect(lp).connect(g).connect(bus);o.start(t);o.stop(t+beat*.5);}
 for(let t=4.9+beat*2;t<D-.8;t+=beat){const s=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nb;hp.type='highpass';hp.frequency.value=6500;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);s.connect(hp).connect(g).connect(bus);s.start(t,(t*.3)%1.5);s.stop(t+.05);}
 const nz=(t,d,p,type,f1,f2)=>{const s=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nb;fl.type=type;fl.frequency.setValueAtTime(f1,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(p,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(bus);s.start(t,(t*.7)%1.5);s.stop(t+d+.05);};
 const osc=(f,t,d,p,f2,ty='sine')=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(p,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(bus);o.start(t);o.stop(t+d+.05);};
 nz(T1+.05,.75,.22,'bandpass',500,4200);nz(T1+.55,.25,.12,'highpass',2500);osc(80,T2-.05,.35,.25,45);
 const clunk=t=>{osc(110,t,.25,.5,55);nz(t,.08,.3,'bandpass',1800);};
 clunk(VO+1.6);osc(300,VO+1.8,1.2,.2,90,'triangle');osc(200,VO+6.6,1,.2,700,'triangle');clunk(VO+8);nz(VO+9.5,.6,.15,'bandpass',300,1500);clunk(VO+15.2);clunk(VO+21.6);osc(70,VO+24.4,.8,.5,35);nz(VO+24.4,.3,.2,'lowpass',2000);};

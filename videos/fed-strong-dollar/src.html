const VERT=__VERT__;const W=VERT?1080:1920,H=VERT?1920:1080;const U=Math.min(W,H)/1080;

function spring(t,w=14,z=.82){if(t<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}

 font(500,22,'GM');txt(lab,0,-30*U,'#5a4a30','left');const k=ease(seg(t,a,b)),n=pts.length-1,up=k*n;x.strokeStyle=INK;x.lineWidth=5*U;x.lineJoin='round';x.beginPath();for(let i=0;i<=Math.floor(up);i++){const p=pts[i];i?x.lineTo(p[0]*w,(1-p[1])*h):x.moveTo(p[0]*w,(1-p[1])*h);}

 if(circle&&t>b){const p=pts[circle.i],cx=p[0]*w,cy=(1-p[1])*h,kk=ease(seg(t,b,b+.6));x.strokeStyle=RED;x.lineWidth=6*U;x.beginPath();for(let s=0;s<=kk*1.15;s+=.02){const an=s*Math.PI*2-1.2,r=70*U*(1+.06*Math.sin(s*9));x.lineTo(cx+Math.cos(an)*r*1.4,cy+Math.sin(an)*r);}x.stroke();

 for(let la=-60;la<=80;la+=20){const [a1,b1]=mapPos(la,-180),[a2,b2]=mapPos(la,180);x.beginPath();x.moveTo(a1,b1);x.lineTo(a2,b2);x.stroke();}font(500,20,'GM');txt('FIG. 1 — WHERE THE DOLLARS GO',x0+10*U,y0+20*U,'#6a5a40','left');x.restore();}

function flowDots(t,a,targets,to){if(t<a)return;const [tx,ty]=mapPos(...CITIES[to]);targets.forEach((n,i)=>{const [sx,sy]=mapPos(...CITIES[n]);for(let j=0;j<4;j++){const ph=((t-a)*.45+j/4+i*.13)%1;const px=lerp(sx,tx,ph),py=lerp(sy,ty,ph)-Math.sin(ph*Math.PI)*90*U;font(900,26);x.globalAlpha=Math.sin(ph*Math.PI);txt('$',px,py,GREEN);x.globalAlpha=1;}});}
